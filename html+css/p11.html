<!DOCTYPE html>
<html>
    <head>
        <title>셀렉터 만들기</title>
        <style>
            h3, li {color:brown}
            div > div > strong {
                background:yellow;
            }
            ul strong {color:dodgerblue}
            .warning {color:red}
            body.main{background: aliceblue;}
            #list {background: mistyrose;}
            #list span{color : #8a2be2;}
            li:hover{background: yellowgreen;}
        </style>
    </head>
    <body class="main">
        <h3>웹 프로그래밍</h3>
        <hr>
        <div>
            <div>2학기 <strong>학습내용</strong> 입니다.</div>
            <ul id="list">
                <li><span>HTML5</span></li>
                <li><strong>CSS</strong></li>
                <li>JavaScript</li>
            </ul>
            <ul>
                <li><span>HTML5</span></li>
                <li><strong>CSS</strong></li>
                <li>JavaScript</li>
            </ul>
            <div class="warning">60점 이하는 F임</div>
        </div>
    </body>
</html>
