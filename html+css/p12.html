<!DOCTYPE html>
<html>
    <head>
        <style>
            body{background: ghostwhite;
                background-image: url("p02img01.jpg");
                background-size: 100px 100px;}
            span{background: deepskyblue;}
            div.box{
                background: yellow;
                margin : 40px;
                padding : 20px;
                border-style: solid;
                border-color: peru;
                border-width: 5px;
                border-radius: 0px 0px 20px 20px;
                box-shadow: 10px 10px red;
            }
            div.box2{
                background: rebeccapurple;
                margin : 40px;
                padding : 20px;
                border-style: solid;
                border-color: peru;
                border-width: 5px;
                text-shadow: 3px 3px grey;
                cursor: help;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <span>DIV DIV DIV</span>
        </div>
        <div class="box2">
            <span>DIV DIV DIV</span>
        </div>
    </body>
</html>
