<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>첫 번째 자바스크립트</title>
    <!-- 자바스크립트 코드는 <script> 태그 안에 작성합니다 -->
    <script>
        // alert() 함수는 브라우저에 알림창을 띄워줍니다.
        alert("환영합니다! 자바스크립트의 세계에 오신 것을 환영합니다.");
    </script>
</head>
<body>
    <h3>자바스크립트 기본 실행</h3>
    <hr>
    <p>웹 브라우저가 열리면 상단에 알림창이 먼저 나타납니다.</p>
</body>
</html>
