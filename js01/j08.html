<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>오늘의 점심 메뉴 추천</title>
    <script>
        // 0부터 (max-1)까지의 무작위 정수를 반환하는 함수
        function getRandomIndex(max) {
            return Math.floor(Math.random() * max);
        }
    </script>
</head>
<body>
    <h3>오늘의 추천 점심 메뉴</h3>
    <hr>
    <script>
        // 1. 메뉴 목록 배열 준비
        let menuList = ["김치찌개", "마라탕", "돈까스", "자장면", "수제버거", "초밥"];

        // 2. 0 ~ (배열길이 - 1) 사이의 무작위 인덱스 추출
        let randomIndex = getRandomIndex(menuList.length);

        // 3. 추천 결과 출력
        document.write("선택할 수 있는 메뉴 수: " + menuList.length + "개<br>");
        document.write("오늘 당신에게 추천하는 메뉴는? -> <b>[" + menuList[randomIndex] + "]</b>");
    </script>
</body>
</html>
