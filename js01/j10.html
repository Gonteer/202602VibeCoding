<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>innerHTML 활용</title>
    <script>
        function changeContent() {
            let p = document.getElementById("firstP");
            // firstP 영역의 내부 HTML 콘텐츠를 텍스트와 이미지 태그로 변경 [6]
            p.innerHTML = "나의 <img src='puppy.png' width='100'> 강아지입니다.";
        }
    </script>
</head>
<body>
    <h3>innerHTML 활용 : 글자를 클릭하면 내용이 변합니다</h3>
    <hr>
    <!-- 클릭 이벤트가 발생하면 changeContent() 함수 실행 [6, 7] -->
    <p id="firstP" style="color:blue; cursor:pointer;" onclick="changeContent()">
        여기를 <span style="color:red;">클릭하세요!</span>
    </p>
</body>
</html>
