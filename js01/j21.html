<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>윈도우 닫기</title>
    <script>
        let newWin = null; // 새로 연 윈도우 객체를 저장할 변수

        // 새 윈도우 열기 함수
        function load(URL) {
            // (300, 300) 위치에 400x300 크기로 myWin 이름의 새 윈도우 열기
            newWin = window.open(URL, "myWin", "left=300,top=300,width=400,height=300");
        }

        // 새로 생성된 윈도우 닫기 함수
        function closeNewWindow() {
            if (newWin == null || newWin.closed) { // 열리지 않았거나 이미 닫힌 경우
                return;
            } else {
                newWin.close(); // 생성된 팝업 창 닫기
            }
        }
    </script>
</head>
<body>
    <h3>window의 close()로 윈도우 닫기</h3>
    <hr>
    <!-- 링크 클릭 시 새 팝업창을 열거나 닫음 -->
    <a href="javascript:load('http://www.disneyworld.com')">1. 새 윈도우 열기(디즈니월드)</a><br>
    <a href="javascript:window.close()">2. 현재 윈도우 닫기</a><br>
    <a href="javascript:closeNewWindow()">3. 새 윈도우 닫기</a>
</body>
</html>
