<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>[실습2] 마우스를 올리면 색이 변하는 마법상자</title>
    <style>
        #magicBox {
            width: 300px;
            padding: 20px;
            border: 2px solid darkslateblue;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h3>[실습2] 마우스를 올리면 색이 변하는 마법상자</h3>
    <hr>

    <!-- 실습 대상 요소 -->
    <p id='magicBox'>마우스를 올려보세요 !</p>

    <script>
        // DOM 요소 가져오기
        let box = document.getElementById('magicBox');

        // 마우스가 올라갈 때 (mouseover)
        box.addEventListener('mouseover', function() {
            box.style.backgroundColor = 'orchid';
        });

        // 마우스가 벗어날 때 (mouseout)
        box.addEventListener('mouseout', function() {
            box.style.backgroundColor = 'white';
        });
    </script>
</body>
</html>
